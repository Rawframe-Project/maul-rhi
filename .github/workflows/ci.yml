# Continuous integration for Maul RHI.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PREFIX: MAUL_RHI

jobs:
  # The rules no compiler checks: formatting, static analysis and the
  # family's source, module, documentation and length checks.
  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-20 clang-tidy-20 ninja-build
          pip install clang-format==22.1.5 >/dev/null
      - name: clang-format
        run: |
          clang-format --version
          clang-format --dry-run -Werror $(find include src test tools bench samples -name '*.[ch]' 2>/dev/null)
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
      - name: Contract
        # The public headers and the thread safety table are what the
        # contract generates.
        run: python3 tools/gen_contract.py --check
      - name: clang-tidy
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          # The web-only sources are checked by the web job.
          for f in $(grep -L "emscripten/" src/*.c); do
            clang-tidy-20 -p build --quiet --warnings-as-errors='*' "$f" || exit 1
          done

  # Every cell builds with warnings as errors and runs the whole suite,
  # the header tests included.
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc-14,        os: ubuntu-24.04, cc: gcc-14,   cxx: g++-14,     config: Release, extra: "" }
          - { name: linux-clang-20,      os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Release, extra: "" }
          - { name: linux-clang-20-asan, os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_RHI_SANITIZE=ON" }
          - { name: linux-clang-20-tsan, os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_RHI_TSAN=ON" }
          - { name: linux-shared,        os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Release, extra: "-DMAUL_RHI_BUILD_SHARED=ON" }
          - { name: macos-clang,         os: macos-15,     cc: clang,    cxx: clang++,    config: Release, extra: "" }
          # The Metal driver on the runner's paravirtual device (mrhi-0003).
          - { name: macos-metal,         os: macos-15,     cc: clang,    cxx: clang++,    config: Debug,   extra: "-DMAUL_RHI_METAL_DRIVER=ON -DMAUL_RHI_VULKAN_DRIVER=OFF" }
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers, lavapipe, the validation layer and Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-14 g++-14 clang-20 ninja-build \
            mesa-vulkan-drivers vulkan-validationlayers libxcb1-dev xvfb
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -D${PREFIX}_WERROR=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.extra }}
      - name: Build
        run: cmake --build build -j 4
      - name: Describe the Metal device
        # What the Metal cell runs on: the device's families and argument
        # buffer tier, which decide the driver's limits and heaps.
        if: contains(matrix.extra, 'METAL_DRIVER=ON')
        run: |
          cat > probe.m <<'EOF'
          #import <Metal/Metal.h>
          #include <stdio.h>
          int main(void)
          {
              id<MTLDevice> device = MTLCreateSystemDefaultDevice();
              if (device == nil)
              {
                  printf("no Metal device\n");
                  return 0;
              }
              printf("%s: argument buffers tier %d, unified memory %d\n", device.name.UTF8String,
                     (int)device.argumentBuffersSupport + 1, (int)device.hasUnifiedMemory);
              const struct { MTLGPUFamily family; const char* name; } families[] = {
                  {MTLGPUFamilyApple5, "Apple5"}, {MTLGPUFamilyApple6, "Apple6"},
                  {MTLGPUFamilyApple7, "Apple7"}, {MTLGPUFamilyApple8, "Apple8"},
                  {MTLGPUFamilyApple9, "Apple9"}, {MTLGPUFamilyMac2, "Mac2"},
                  {MTLGPUFamilyCommon3, "Common3"}, {MTLGPUFamilyMetal3, "Metal3"}};
              for (size_t i = 0; i < sizeof(families) / sizeof(families[0]); ++i)
              {
                  printf("  %s %d\n", families[i].name, (int)[device supportsFamily:families[i].family]);
              }
              printf("  threadgroup memory %lu, buffer %lu\n",
                     (unsigned long)device.maxThreadgroupMemoryLength,
                     (unsigned long)device.maxBufferLength);
              return 0;
          }
          EOF
          clang -fobjc-arc probe.m -framework Metal -framework Foundation -o probe && ./probe
      - name: Test
        # Linux runs Vulkan on lavapipe, which must be found, under the
        # validation layer, whose errors in a test's output fail it,
        # presents to an XCB window on Xvfb, and reads heaps (mrhi-0003).
        # macOS runs Metal in its own cell.
        env:
          MAUL_RHI_REQUIRE_VULKAN: ${{ runner.os == 'Linux' && '1' || '' }}
          MAUL_RHI_REQUIRE_SURFACE: ${{ runner.os == 'Linux' && '1' || '' }}
          MAUL_RHI_REQUIRE_BINDLESS: ${{ runner.os == 'Linux' && '1' || '' }}
          # The Metal cell must find the runner's device, under Metal's API
          # and shader validation, which stop a test on misuse.
          MAUL_RHI_REQUIRE_METAL: ${{ contains(matrix.extra, 'METAL_DRIVER=ON') && '1' || '' }}
          MTL_DEBUG_LAYER: ${{ runner.os == 'macOS' && '1' || '' }}
          MTL_SHADER_VALIDATION: ${{ runner.os == 'macOS' && '1' || '' }}
          VK_INSTANCE_LAYERS: ${{ runner.os == 'Linux' && 'VK_LAYER_KHRONOS_validation' || '' }}
          # Synchronization validation checks the barriers the graph makes.
          VK_KHRONOS_VALIDATION_VALIDATE_SYNC: "true"
          # Lavapipe fills new memory with non-zero bytes, so a read of
          # memory nothing wrote fails reliably.
          LVP_POISON_MEMORY: "true"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a"; else run=""; fi
          $run ctest --test-dir build --output-on-failure

  # Each fuzz target runs for one minute on every push, over the bytes
  # programs load from disk and hand the library, from its seed.
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-20 ninja-build
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON \
            -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_WERROR=ON
          cmake --build build
      - name: Run
        run: |
          python3 tools/container_seed.py corpus-fuzz_container
          for target in build/fuzz_*; do
            mkdir -p "corpus-$(basename $target)"
            "$target" -max_total_time=60 "corpus-$(basename $target)"
          done

  windows-clang-cl:
    name: windows-clang-cl
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -T ClangCL -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  web:
    name: web-emscripten
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Configure
        run: |
          emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build
        run: cmake --build build -j 4
      - name: clang-tidy
        # The web-only sources, against Emscripten's sysroot.
        run: |
          sudo apt-get install -y -q clang-tidy-20
          sysroot=$(em-config CACHE)/sysroot
          for f in $(grep -l "emscripten/" src/*.c); do
            clang-tidy-20 -p build --quiet --warnings-as-errors='*' --extra-arg=--sysroot=$sysroot \
              --extra-arg=--target=wasm32-unknown-emscripten "$f" || exit 1
          done
      - name: Browser
        run: npm install --prefix /tmp/browser puppeteer
      - name: Test
        # The suites run in node, the conformance suite in headless Chrome
        # with WebGPU, which it must find (mrhi-0003).
        env:
          MRHI_NODE_MODULES: /tmp/browser/node_modules
          MAUL_RHI_REQUIRE_WEBGPU: "1"
        run: ctest --test-dir build --output-on-failure
      - name: Size
        # The wasm budget (mrhi-0001): the library at -Oz without its
        # tests, every public function kept.
        run: |
          emcmake cmake -B build-size -DCMAKE_BUILD_TYPE=MinSizeRel \
            "-DCMAKE_C_FLAGS_MINSIZEREL=-Oz -DNDEBUG" -D${PREFIX}_BUILD_TESTS=OFF \
            -D${PREFIX}_BUILD_BENCH=OFF -D${PREFIX}_BUILD_SAMPLES=OFF >/dev/null
          cmake --build build-size -j 4
          python3 tools/wasm_size.py build-size/libmaul-rhi.a
