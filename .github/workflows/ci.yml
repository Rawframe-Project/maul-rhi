# Continuous integration for Maul RHI.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PREFIX: MAUL_RHI

jobs:
  # The rules no compiler checks: formatting, static analysis and the
  # family's source, module, documentation and length checks.
  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-20 clang-tidy-20 ninja-build
          pip install clang-format==22.1.5 >/dev/null
      - name: clang-format
        run: |
          clang-format --version
          clang-format --dry-run -Werror $(find include src test tools bench samples -name '*.[ch]' 2>/dev/null)
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
      - name: Contract
        # The public headers and the thread safety table are what the
        # contract generates.
        run: python3 tools/gen_contract.py --check
      - name: clang-tidy
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          for f in src/*.c; do
            clang-tidy-20 -p build --quiet --warnings-as-errors='*' "$f" || exit 1
          done

  # Every cell builds with warnings as errors and runs the whole suite,
  # the header tests included.
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc-14,        os: ubuntu-24.04, cc: gcc-14,   cxx: g++-14,     config: Release, extra: "" }
          - { name: linux-clang-20,      os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Release, extra: "" }
          - { name: linux-clang-20-asan, os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_RHI_SANITIZE=ON" }
          - { name: linux-clang-20-tsan, os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_RHI_TSAN=ON" }
          - { name: linux-shared,        os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Release, extra: "-DMAUL_RHI_BUILD_SHARED=ON" }
          - { name: macos-clang,         os: macos-15,     cc: clang,    cxx: clang++,    config: Release, extra: "" }
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers, lavapipe, the validation layer and Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-14 g++-14 clang-20 ninja-build \
            mesa-vulkan-drivers vulkan-validationlayers libxcb1-dev xvfb
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -D${PREFIX}_WERROR=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.extra }}
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        # Linux runs Vulkan on lavapipe, which must be found, under the
        # validation layer, whose errors in a test's output fail it,
        # presents to an XCB window on Xvfb, and reads heaps (mrhi-0003).
        env:
          MAUL_RHI_REQUIRE_VULKAN: ${{ runner.os == 'Linux' && '1' || '' }}
          MAUL_RHI_REQUIRE_SURFACE: ${{ runner.os == 'Linux' && '1' || '' }}
          MAUL_RHI_REQUIRE_BINDLESS: ${{ runner.os == 'Linux' && '1' || '' }}
          VK_INSTANCE_LAYERS: ${{ runner.os == 'Linux' && 'VK_LAYER_KHRONOS_validation' || '' }}
          # Synchronization validation checks the barriers the graph makes.
          VK_KHRONOS_VALIDATION_VALIDATE_SYNC: "true"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a"; else run=""; fi
          $run ctest --test-dir build --output-on-failure

  # Each fuzz target runs for one minute on every push, over the bytes
  # programs load from disk and hand the library, from its seed.
  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-20 ninja-build
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON \
            -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_WERROR=ON
          cmake --build build
      - name: Run
        run: |
          python3 tools/container_seed.py corpus-fuzz_container
          for target in build/fuzz_*; do
            mkdir -p "corpus-$(basename $target)"
            "$target" -max_total_time=60 "corpus-$(basename $target)"
          done

  windows-clang-cl:
    name: windows-clang-cl
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -T ClangCL -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  web:
    name: web-emscripten
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Configure
        run: emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Browser
        run: npm install --prefix /tmp/browser puppeteer
      - name: Test
        # The suites run in node, the conformance suite in headless Chrome
        # with WebGPU, which it must find (mrhi-0003).
        env:
          MRHI_NODE_MODULES: /tmp/browser/node_modules
          MAUL_RHI_REQUIRE_WEBGPU: "1"
        run: ctest --test-dir build --output-on-failure
      - name: Size
        run: ls -l build/libmaul-rhi.a
