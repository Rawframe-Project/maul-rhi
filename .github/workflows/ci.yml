# Continuous integration: the pull request check, and the full check on
# main and every night, which fuzzes longer and adds the Android emulator
# and the iOS simulator. Each build cell is a CMake preset built by the
# organization's shared workflow; the other jobs run in the same CI image,
# except the Emscripten build, which needs the emsdk action.
# docs/operations/checks.md explains each job, and tools/check.sh runs the
# Linux presets locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "7 2 * * *"
  workflow_dispatch:

# A new push to a pull request cancels its running CI; runs on main get a
# group of their own, so they are never cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Whether anything beyond documentation changed; the builds skip when not.
  changes:
    uses: Rawframe-Project/.github/.github/workflows/changes.yml@40dc8f20f0da3bb2c9d358aa23ec19d0d6ee309b # v0.0.13
    permissions:
      pull-requests: read

  # The organization's documentation check; khronos/ and directx/ hold
  # the Vulkan and DirectX headers, kept exactly as published.
  docs:
    uses: Rawframe-Project/.github/.github/workflows/docs-check.yml@40dc8f20f0da3bb2c9d358aa23ec19d0d6ee309b # v0.0.13
    permissions:
      contents: read
    with:
      exclude: khronos directx

  zizmor:
    uses: Rawframe-Project/.github/.github/workflows/zizmor.yml@40dc8f20f0da3bb2c9d358aa23ec19d0d6ee309b # v0.0.13
    permissions:
      contents: read

  # The rules no compiler checks: formatting, the family's source, module,
  # length, API documentation and snippet checks, the headers and sources
  # the contract makes, the documentation site, and clang-tidy on the
  # native and the web sources. It runs on documentation changes too, since
  # the snippet check and the site read docs/.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.6@sha256:50c383f608f992c272196139d749f15978e35143a2876362b1e0aef6993480bd
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: clang-format
        run: |
          clang-format --version
          # A checkout git refused would list nothing and pass unchecked.
          files=$(git ls-files '*.c' '*.h' '*.m' ':!khronos/' ':!directx/')
          [ -n "$files" ] || { echo "::error::git listed no sources"; exit 1; }
          echo "$files" | xargs clang-format --dry-run -Werror
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
          python3 tools/check_guide.py
      - name: The contract's headers and sources
        run: python3 tools/gen_contract.py --check
      # CI has no shader tools: the committed headers' stamps are checked
      # against their inputs and pins, and each check proven on a copy.
      - name: The shader headers' stamps
        run: |
          python3 tools/gen_test_shaders.py --check
          python3 tools/gen_test_shaders.py --self-test
          python3 tools/gen_kernels.py --check
          python3 tools/gen_kernels.py --self-test
      - name: The documentation site builds
        run: python3 tools/build_docs.py
      - name: clang-tidy
        # The native sources against Linux, the web ones against wasm32-wasi;
        # the D3D12 sources need Windows' headers and build in the Windows
        # cells.
        run: |
          cmake --preset linux-clang-20 -B out/tidy -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DMAUL_RHI_LABELS=ON >/dev/null
          cmake --preset web-wasi -B out/tidy-web -DCMAKE_EXPORT_COMPILE_COMMANDS=ON >/dev/null
          grep -L '"web_js.h"' src/*.c | grep -v d3d12 |
            xargs -P 4 -n 1 clang-tidy-20 -p out/tidy --quiet --warnings-as-errors='*'
          grep -l '"web_js.h"' src/*.c |
            xargs -P 4 -n 1 clang-tidy-20 -p out/tidy-web --quiet --warnings-as-errors='*'

  # Every cell builds with warnings as errors and runs its test preset.
  # Linux runs Vulkan on lavapipe under the validation layer, presenting to
  # Xvfb, or for the Wayland seam to weston; macOS runs Metal under its
  # validation; Windows runs D3D12 on WARP under the Agility SDK's debug
  # layer, or the Vulkan driver without an adapter.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { preset: linux-gcc-14, setup: tools/ci_display.sh x11 }
          - { preset: linux-clang-20, setup: tools/ci_display.sh x11 }
          - { preset: linux-clang-20-asan, setup: tools/ci_display.sh x11, repeat: 3 }
          - { preset: linux-clang-20-tsan, setup: tools/ci_display.sh x11 }
          - { preset: linux-shared, setup: tools/ci_display.sh x11 }
          - { preset: linux-seam-x11, setup: tools/ci_display.sh x11 }
          - { preset: linux-seam-wayland, setup: tools/ci_display.sh wayland }
          - { preset: web-wasi, setup: tools/ci_browser.sh }
          - { preset: macos-clang, runner: macos-15, setup: tools/ci_metal.sh }
          - { preset: macos-clang-debug, runner: macos-26, setup: tools/ci_metal.sh }
          - { preset: windows-d3d12, runner: windows-2025, setup: tools/ci_agility.sh }
          - { preset: windows-vulkan, runner: windows-2025 }
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@40dc8f20f0da3bb2c9d358aa23ec19d0d6ee309b # v0.0.13
    permissions:
      contents: read
    with:
      preset: ${{ matrix.preset }}
      runner: ${{ matrix.runner || 'ubuntu-24.04' }}
      repeat: ${{ matrix.repeat || 1 }}
      setup: ${{ matrix.setup || '' }}

  # The public headers alone under MSVC's cl, as C17 and C++17 with /W4 /WX:
  # consumers may compile them with it, though it cannot build the library.
  msvc-headers:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B out/headers
          cmake --build out/headers --config Release

  # The library under Emscripten: the suites in Node, the conformance suite
  # and the seam check in headless Chrome with WebGPU, which they must find,
  # and the size of the library at -Oz against its budget. The CI image has
  # no Emscripten, so this job uses the runner and the emsdk action.
  web-emscripten:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
      - name: Browser
        run: tools/ci_browser.sh
      - name: Configure
        run: cmake --preset web-emscripten
      - name: Build
        run: cmake --build --preset web-emscripten
      - name: Test
        run: |
          ctest --preset web-emscripten | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Size
        # The library at -Oz without its tests, every public function kept.
        run: |
          emcmake cmake -B out/web-size -DCMAKE_BUILD_TYPE=MinSizeRel \
            "-DCMAKE_C_FLAGS_MINSIZEREL=-Oz -DNDEBUG" -DMAUL_RHI_BUILD_TESTS=OFF \
            -DMAUL_RHI_BUILD_BENCH=OFF -DMAUL_RHI_BUILD_SAMPLES=OFF >/dev/null
          cmake --build out/web-size -j 4
          python3 tools/wasm_size.py out/web-size/libmaul-rhi.a
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-web-emscripten
          path: out/web-emscripten/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  # Each fuzz target over the bytes programs load from disk and hand the
  # library (shader containers and pipeline caches), from its seeds:
  # briefly on a pull request, longer on main and at night.
  fuzz:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: ghcr.io/rawframe-project/ci-cpp:2026.10.6@sha256:50c383f608f992c272196139d749f15978e35143a2876362b1e0aef6993480bd
    permissions:
      contents: read
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 30 || 300 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: |
          cmake -B out/fuzz -G Ninja -DCMAKE_C_COMPILER=clang-20 -DMAUL_RHI_FUZZ=ON \
            -DMAUL_RHI_BUILD_TESTS=OFF -DMAUL_RHI_WERROR=ON
          cmake --build out/fuzz
      - name: Run
        # The targets side by side; a target's output goes to its log,
        # printed when it finds something.
        run: |
          mkdir -p out/fuzz-logs out/corpus/fuzz_cache
          python3 tools/container_seed.py out/corpus/fuzz_container >/dev/null
          fuzz_one() {
            name=$(basename "$1")
            if "$1" -max_total_time="$FUZZ_SECONDS" "out/corpus/$name" >"out/fuzz-logs/$name.log" 2>&1; then
              echo "$name: no finding"
            else
              tail -n 60 "out/fuzz-logs/$name.log"
              echo "::error::$name found something"
              return 1
            fi
          }
          export -f fuzz_one
          printf '%s\n' out/fuzz/fuzz_* | xargs -P 2 -I {} bash -c 'fuzz_one "$1"' _ {}
      - name: Fuzz logs and crash inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz
          path: |
            out/fuzz-logs/
            crash-*
            leak-*
            timeout-*
            oom-*
          if-no-files-found: ignore
          retention-days: 7

  # The windows-d3d12 cell with GPU-based validation's resource state
  # tracking, which pull requests run without: on a device whose objects
  # were made and released before, it reports false errors in about one
  # run in fifty (#7, test/d3d12_uav_check.c). Nightly and by hand only,
  # and never retried, until the Agility SDK fixes it.
  windows-d3d12-states:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: Rawframe-Project/.github/.github/workflows/cpp.yml@40dc8f20f0da3bb2c9d358aa23ec19d0d6ee309b # v0.0.13
    permissions:
      contents: read
    with:
      preset: windows-d3d12-states
      runner: windows-2025
      setup: tools/ci_agility.sh

  # The Vulkan driver on Android in the emulator, Android 15 on x86_64 with
  # KVM, whose SwiftShader offers Vulkan 1.3: every test through adb. Nightly
  # only, as booting the emulator takes minutes.
  android-emulator:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_SERIAL: emulator-5554
      # Where avdmanager writes the device and the emulator reads it.
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Boot the emulator
        timeout-minutes: 15
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --licenses >/dev/null 2>&1 || true
          # Runner images move to newer NDKs: the pinned one is installed when
          # the image lacks it.
          [ -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" ] ||
            "$tools/sdkmanager" --install "ndk;${ANDROID_NDK_HOME##*/}" >/dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          "$tools/sdkmanager" --install emulator "system-images;android-35;google_apis;x86_64" >/dev/null
          echo no | "$tools/avdmanager" create avd -n maul35 -k "system-images;android-35;google_apis;x86_64" -d pixel_5 >/dev/null
          nohup "$ANDROID_HOME/emulator/emulator" -avd maul35 -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -port 5554 > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator=$!
          echo "EMULATOR_PID=$emulator" >> "$GITHUB_ENV"
          adb="$ANDROID_HOME/platform-tools/adb"
          for _ in $(seq 1 90); do
            [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            kill -0 "$emulator" 2>/dev/null || break
            sleep 5
          done
          "$adb" shell getprop sys.boot_completed | grep -q 1 || { tail -50 "$RUNNER_TEMP/emulator.log"; exit 1; }
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Configure
        run: cmake --preset android-emulator
      - name: Build
        run: cmake --build --preset android-emulator
      - name: Test
        run: |
          ctest --preset android-emulator | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-android-emulator
          path: out/android-emulator/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the emulator
        if: always() && env.EMULATOR_PID != ''
        run: kill "$EMULATOR_PID" || true

  # The Metal driver built for iOS, every test in the simulator through
  # simctl spawn, on an iPhone of the newest runtime. Nightly only, as
  # booting the simulator takes minutes.
  ios-simulator:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r),
                            key=lambda r: [int(p) for p in r.rsplit("iOS-", 1)[1].split("-")])
          print(next(d["udid"] for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "MWIN_IOS_DEVICE=$udid" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset ios-simulator
      - name: Build
        run: cmake --build --preset ios-simulator
      - name: Test
        run: |
          ctest --preset ios-simulator | tee "$RUNNER_TEMP/ctest.log"
          if grep -E '\*\*\*(Skipped|Not Run)' "$RUNNER_TEMP/ctest.log"; then
            echo "::error::a test did not run"; exit 1
          fi
      - name: Test logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-ios-simulator
          path: out/ios-simulator/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
      - name: Shut the simulator down
        if: always() && env.MWIN_IOS_DEVICE != ''
        run: xcrun simctl shutdown "$MWIN_IOS_DEVICE" || true

  # The one check the ruleset requires: it passes when every job above
  # passed or was skipped (for a documentation-only change, or a nightly
  # job on a pull request), so adding or renaming a job never touches the
  # ruleset.
  required:
    if: always()
    needs: [changes, docs, zizmor, checks, build, msvc-headers, web-emscripten, fuzz, windows-d3d12-states, android-emulator, ios-simulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success | skipped) ;; *) exit 1 ;; esac
          done
