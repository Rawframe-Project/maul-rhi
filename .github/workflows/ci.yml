# Continuous integration for Maul RHI.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PREFIX: MAUL_RHI

jobs:
  # The rules no compiler checks: formatting, static analysis and the
  # family's source, module, documentation and length checks.
  checks:
    name: checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-20 clang-tidy-20 ninja-build
          pip install clang-format==22.1.5 >/dev/null
      - name: clang-format
        run: |
          clang-format --version
          clang-format --dry-run -Werror $(find include src test tools bench samples -name '*.[ch]' 2>/dev/null)
      - name: Family checks
        run: |
          python3 tools/check_source.py
          python3 tools/check_modules.py
          python3 tools/check_docs.py
          python3 tools/check_lengths.py
      - name: API reference
        # docs/api.md is what the generator makes from the headers, and
        # the README gives its function count.
        run: |
          COUNT=$(python3 tools/gen_api.py | grep -oE '\([0-9]+ functions\)' | grep -oE '[0-9]+')
          git diff --exit-code docs/api.md || { echo "docs/api.md is stale: run tools/gen_api.py"; exit 1; }
          grep -q "$COUNT public functions" README.md || { echo "README says the wrong function count ($COUNT)"; exit 1; }
      - name: Contract
        # The public headers and the thread safety table are what the
        # contract generates.
        run: python3 tools/gen_contract.py --check
      - name: clang-tidy
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -DCMAKE_CXX_COMPILER=clang++-20 \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          # The web-only sources are checked by the web job; the D3D12 ones
          # need Windows' headers and build in the Windows jobs.
          for f in $(grep -L '"web_js.h"' src/*.c | grep -v d3d12); do
            clang-tidy-20 -p build --quiet --warnings-as-errors='*' "$f" || exit 1
          done

  # Every cell builds with warnings as errors and runs the whole suite,
  # the header tests included.
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc-14,        os: ubuntu-24.04, cc: gcc-14,   cxx: g++-14,     config: Release, extra: "" }
          - { name: linux-clang-20,      os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Release, extra: "-DMAUL_RHI_LABELS=OFF" }
          - { name: linux-clang-20-asan, os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_RHI_SANITIZE=ON -DMAUL_RHI_VALIDATION=ON" }
          - { name: linux-clang-20-tsan, os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Debug,   extra: "-DMAUL_RHI_TSAN=ON" }
          - { name: linux-shared,        os: ubuntu-24.04, cc: clang-20, cxx: clang++-20, config: Release, extra: "-DMAUL_RHI_BUILD_SHARED=ON" }
          # The Metal driver on the runner's paravirtual device (mrhi-0003),
          # as released on macOS 15 and with assertions on macOS 26, each
          # with the seam check on the runner's window server (mrhi-0028).
          - { name: macos-clang,         os: macos-15,     cc: clang,    cxx: clang++,    config: Release, extra: "-DMAUL_RHI_SEAM=ON" }
          - { name: macos-clang-debug,   os: macos-26,     cc: clang,    cxx: clang++,    config: Debug,   extra: "-DMAUL_RHI_SEAM=ON" }
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers, lavapipe, the validation layer and Xvfb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-14 g++-14 clang-20 ninja-build \
            mesa-vulkan-drivers vulkan-validationlayers libxcb1-dev xvfb
      - name: Configure
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -D${PREFIX}_WERROR=ON \
            -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} ${{ matrix.extra }}
      - name: Build
        run: cmake --build build -j 4
      - name: Describe the Metal device
        # What macOS runs on: the Metal device's families, argument
        # buffer tier and counter sampling, which decide the driver's
        # limits, heaps and timestamps.
        if: runner.os == 'macOS'
        run: |
          cat > probe.m <<'EOF'
          #import <Metal/Metal.h>
          #include <stdio.h>
          int main(void)
          {
              id<MTLDevice> device = MTLCreateSystemDefaultDevice();
              if (device == nil)
              {
                  printf("no Metal device\n");
                  return 0;
              }
              printf("%s: argument buffers tier %d, unified memory %d\n", device.name.UTF8String,
                     (int)device.argumentBuffersSupport + 1, (int)device.hasUnifiedMemory);
              const struct { MTLGPUFamily family; const char* name; } families[] = {
                  {MTLGPUFamilyApple5, "Apple5"}, {MTLGPUFamilyApple6, "Apple6"},
                  {MTLGPUFamilyApple7, "Apple7"}, {MTLGPUFamilyApple8, "Apple8"},
                  {MTLGPUFamilyApple9, "Apple9"}, {MTLGPUFamilyMac2, "Mac2"},
                  {MTLGPUFamilyCommon3, "Common3"}, {MTLGPUFamilyMetal3, "Metal3"}};
              for (size_t i = 0; i < sizeof(families) / sizeof(families[0]); ++i)
              {
                  printf("  %s %d\n", families[i].name, (int)[device supportsFamily:families[i].family]);
              }
              printf("  threadgroup memory %lu, buffer %lu\n",
                     (unsigned long)device.maxThreadgroupMemoryLength,
                     (unsigned long)device.maxBufferLength);
              printf("  counter sampling at stage %d, draw %d, dispatch %d, blit %d boundaries\n",
                     (int)[device supportsCounterSampling:MTLCounterSamplingPointAtStageBoundary],
                     (int)[device supportsCounterSampling:MTLCounterSamplingPointAtDrawBoundary],
                     (int)[device supportsCounterSampling:MTLCounterSamplingPointAtDispatchBoundary],
                     (int)[device supportsCounterSampling:MTLCounterSamplingPointAtBlitBoundary]);
              for (id<MTLCounterSet> set in device.counterSets)
              {
                  printf("  counter set %s\n", set.name.UTF8String);
              }
              return 0;
          }
          EOF
          clang -fobjc-arc probe.m -framework Metal -framework Foundation -o probe && ./probe
      - name: Probe presentation timing
        # Whether a drawable shown in a window reports when it was
        # presented, which present timing needs.
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          cat > present.m <<'EOF'
          #import <Cocoa/Cocoa.h>
          #import <Metal/Metal.h>
          #import <QuartzCore/CAMetalLayer.h>
          #include <stdatomic.h>
          #include <stdio.h>
          int main(void)
          {
              @autoreleasepool
              {
                  [NSApplication sharedApplication];
                  [NSApp setActivationPolicy:NSApplicationActivationPolicyRegular];
                  [NSApp finishLaunching];
                  [NSApp activateIgnoringOtherApps:YES];
                  printf("%lu screens\n", (unsigned long)NSScreen.screens.count);
                  NSWindow* window = [[NSWindow alloc] initWithContentRect:NSMakeRect(0, 0, 256, 256)
                                                                 styleMask:NSWindowStyleMaskTitled
                                                                   backing:NSBackingStoreBuffered
                                                                     defer:NO];
                  id<MTLDevice> device = MTLCreateSystemDefaultDevice();
                  CAMetalLayer* layer = [CAMetalLayer layer];
                  layer.device = device;
                  layer.pixelFormat = MTLPixelFormatBGRA8Unorm;
                  layer.drawableSize = CGSizeMake(256, 256);
                  window.contentView.wantsLayer = YES;
                  window.contentView.layer = layer;
                  [window makeKeyAndOrderFront:nil];
                  for (int spin = 0; spin < 50; ++spin)
                  {
                      NSEvent* event = [NSApp nextEventMatchingMask:NSEventMaskAny
                                                          untilDate:[NSDate dateWithTimeIntervalSinceNow:0.01]
                                                             inMode:NSDefaultRunLoopMode
                                                            dequeue:YES];
                      if (event != nil)
                      {
                          [NSApp sendEvent:event];
                      }
                  }
                  printf("window visible %d, occlusion visible %d, on screen %d\n", (int)window.isVisible,
                         (int)((window.occlusionState & NSWindowOcclusionStateVisible) != 0),
                         (int)(window.screen != nil));
                  id<MTLCommandQueue> queue = [device newCommandQueue];
                  static atomic_int handled;
                  for (int i = 0; i < 30; ++i)
                  {
                      id<CAMetalDrawable> drawable = [layer nextDrawable];
                      if (drawable == nil)
                      {
                          printf("no drawable at %d\n", i);
                          continue;
                      }
                      CFTimeInterval asked = CACurrentMediaTime() + 0.05;
                      bool timed = i % 2 == 1;
                      [drawable addPresentedHandler:^(id<MTLDrawable> shown) {
                          printf("drawable %lu presented at %.6f (asked %.6f)\n",
                                 (unsigned long)shown.drawableID, shown.presentedTime, timed ? asked : 0.0);
                          atomic_fetch_add(&handled, 1);
                      }];
                      id<MTLCommandBuffer> commands = [queue commandBuffer];
                      MTLRenderPassDescriptor* pass = [MTLRenderPassDescriptor renderPassDescriptor];
                      pass.colorAttachments[0].texture = drawable.texture;
                      pass.colorAttachments[0].loadAction = MTLLoadActionClear;
                      pass.colorAttachments[0].storeAction = MTLStoreActionStore;
                      [[commands renderCommandEncoderWithDescriptor:pass] endEncoding];
                      if (timed)
                      {
                          [commands presentDrawable:drawable atTime:asked];
                      }
                      else
                      {
                          [commands presentDrawable:drawable];
                      }
                      [commands commit];
                      [[NSRunLoop currentRunLoop] runUntilDate:[NSDate dateWithTimeIntervalSinceNow:0.02]];
                  }
                  [[NSRunLoop currentRunLoop] runUntilDate:[NSDate dateWithTimeIntervalSinceNow:1.0]];
                  printf("%d presented handlers ran\n", atomic_load(&handled));
              }
              return 0;
          }
          EOF
          clang -fobjc-arc present.m -framework Cocoa -framework Metal -framework QuartzCore -o present && ./present
      - name: Check Metal's texture usage validation
        # Shader validation's texture usage check zeroes a correctly made
        # texture's samples on the macOS 26 image, which a program with no
        # library code shows (test/metal_usage_check.m); where it does,
        # the suite runs without that one check, and with it again once
        # the platform is fixed.
        if: runner.os == 'macOS'
        env:
          MTL_DEBUG_LAYER: "1"
          MTL_SHADER_VALIDATION: "1"
        run: |
          clang -fobjc-arc test/metal_usage_check.m -framework Metal -framework Foundation -o usage_check
          result=$(./usage_check)
          echo "$result"
          case "$result" in
            *broken*)
              echo "::warning::Metal's texture usage validation is broken on this image; the suite runs without it"
              echo "MTL_SHADER_VALIDATION_TEXTURE_USAGE=0" >> "$GITHUB_ENV" ;;
          esac
      - name: Test
        # Linux runs Vulkan on lavapipe, which must be found, under the
        # validation layer, whose errors in a test's output fail it,
        # presents to an XCB window on Xvfb, reads heaps (mrhi-0003),
        # counts pipeline statistics (mrhi-0023) and runs the suite again
        # with its Vulkan driver handed in from outside (mrhi-0024).
        # macOS runs Metal in its own cell.
        env:
          MAUL_RHI_REQUIRE_VULKAN: ${{ runner.os == 'Linux' && '1' || '' }}
          MAUL_RHI_REQUIRE_SURFACE: ${{ runner.os != 'Windows' && '1' || '' }}
          MAUL_RHI_REQUIRE_BINDLESS: ${{ runner.os == 'Linux' && '1' || '' }}
          MAUL_RHI_REQUIRE_STATISTICS: ${{ runner.os == 'Linux' && '1' || '' }}
          MAUL_RHI_REQUIRE_EXTERNAL: ${{ runner.os == 'Linux' && '1' || '' }}
          # macOS must find the runner's Metal device, under Metal's API
          # and shader validation, which stop a test on misuse.
          MAUL_RHI_REQUIRE_METAL: ${{ runner.os == 'macOS' && '1' || '' }}
          MTL_DEBUG_LAYER: ${{ runner.os == 'macOS' && '1' || '' }}
          MTL_SHADER_VALIDATION: ${{ runner.os == 'macOS' && '1' || '' }}
          VK_INSTANCE_LAYERS: ${{ runner.os == 'Linux' && 'VK_LAYER_KHRONOS_validation' || '' }}
          # Synchronization validation checks the barriers the graph makes.
          VK_KHRONOS_VALIDATION_VALIDATE_SYNC: "true"
          # Lavapipe fills new memory with non-zero bytes, so a read of
          # memory nothing wrote fails reliably.
          LVP_POISON_MEMORY: "true"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a"; else run=""; fi
          $run ctest --test-dir build --output-on-failure

  seam:
    # The seam with Maul Window (mrhi-0028): Maul Window fetched at its
    # release tag for this check alone, its X11 window on Xvfb and its
    # Wayland window on weston's headless compositor made into surfaces
    # on lavapipe, under the validation layer.
    name: seam-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the compiler, lavapipe, Xvfb, weston and Maul Window's files
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-20 ninja-build mesa-vulkan-drivers \
            vulkan-validationlayers xvfb weston libwayland-dev wayland-protocols \
            libxcb1-dev libxcb-randr0-dev libxcb-xkb-dev libxcb-cursor-dev \
            libxcb-render0-dev libxcb-xinput-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Configure
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -DMAUL_RHI_WERROR=ON \
            -DMAUL_RHI_SEAM=ON
      - name: Build
        run: cmake --build build --target test_seam
      - name: Test
        env:
          MAUL_RHI_REQUIRE_VULKAN: "1"
          MAUL_RHI_REQUIRE_SURFACE: "1"
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          echo "== X11"
          xvfb-run -a ctest --test-dir build -R '^seam$' --output-on-failure
          echo "== Wayland"
          export XDG_RUNTIME_DIR=$(mktemp -d)
          weston --backend=headless --socket=wayland-seam --idle-time=0 &
          for i in $(seq 1 40); do [ -S "$XDG_RUNTIME_DIR/wayland-seam" ] && break; sleep 0.25; done
          WAYLAND_DISPLAY=wayland-seam ctest --test-dir build -R '^seam$' --output-on-failure

  # Each fuzz target runs for one minute on every push, over the bytes
  # programs load from disk and hand the library, from its seed.
  ios:
    # The Metal driver built for iOS, every test in the simulator through
    # simctl spawn, on an iPhone of the newest runtime.
    name: ios-simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Boot a simulator
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((r for r in devices if ".iOS-" in r),
                            key=lambda r: [int(p) for p in r.rsplit("iOS-", 1)[1].split("-")])
          print(next(d["udid"] for d in devices[runtimes[-1]] if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "MWIN_IOS_DEVICE=$udid" >> "$GITHUB_ENV"
      - name: Configure
        run: >
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/ios-simulator.cmake
          -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 240

  android:
    # The Vulkan driver on Android (mrhi-0017) in the emulator, Android
    # 15 on x86_64 with KVM, whose SwiftShader offers Vulkan 1.3: every
    # test through adb, a native adapter required.
    name: android-emulator
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_SERIAL: emulator-5554
      # Where avdmanager writes the device and the emulator reads it.
      ANDROID_AVD_HOME: /home/runner/.android/avd
      MAUL_RHI_REQUIRE_VULKAN: 1
    steps:
      - uses: actions/checkout@v4
      - name: Boot the emulator
        timeout-minutes: 15
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          yes | "$tools/sdkmanager" --licenses >/dev/null 2>&1 || true
          # Runner images move to newer NDKs: the pinned one is installed when
          # the image lacks it.
          [ -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" ] ||
            "$tools/sdkmanager" --install "ndk;${ANDROID_NDK_HOME##*/}" >/dev/null
          mkdir -p "$ANDROID_AVD_HOME"
          "$tools/sdkmanager" --install emulator "system-images;android-35;google_apis;x86_64" >/dev/null
          echo no | "$tools/avdmanager" create avd -n maul35 -k "system-images;android-35;google_apis;x86_64" -d pixel_5 >/dev/null
          nohup "$ANDROID_HOME/emulator/emulator" -avd maul35 -no-window -no-audio -no-boot-anim \
            -no-snapshot -gpu swiftshader_indirect -port 5554 > emulator.log 2>&1 &
          emulator=$!
          adb="$ANDROID_HOME/platform-tools/adb"
          for i in $(seq 1 90); do
            [ "$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            kill -0 "$emulator" 2>/dev/null || break
            sleep 5
          done
          "$adb" shell getprop sys.boot_completed | grep -q 1 || { tail -50 emulator.log; exit 1; }
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: Configure
        run: >
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/android-emulator.cmake
          -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 240

  fuzz:
    name: fuzz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compilers
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-20 ninja-build
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-20 -D${PREFIX}_FUZZ=ON \
            -D${PREFIX}_BUILD_TESTS=OFF -D${PREFIX}_WERROR=ON
          cmake --build build
      - name: Run
        run: |
          python3 tools/container_seed.py corpus-fuzz_container
          for target in build/fuzz_*; do
            mkdir -p "corpus-$(basename $target)"
            "$target" -max_total_time=60 "corpus-$(basename $target)"
          done

  windows-clang-cl:
    name: windows-clang-cl
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Vulkan instead of D3D12, the alternative a Windows build may take.
      - name: Configure
        run: >
          cmake -B build -T ClangCL -D${PREFIX}_WERROR=ON -D${PREFIX}_D3D12_DRIVER=OFF
          -D${PREFIX}_VULKAN_DRIVER=ON
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      # The public headers alone under MSVC's cl, as C17 and C++17 with
      # /W4 /WX, which cannot build the library itself (family record 0008).
      - name: Headers under MSVC
        run: |
          cmake -S cmake/HeaderCheck -B build-headers
          cmake --build build-headers --config Release

  # The default Windows build, the D3D12 driver, on WARP, the runner's
  # software adapter, under the Agility SDK's debug layer with GPU-based
  # validation, whose errors fail the suites (mrhi-0003); the samples run
  # there too. The SDK's NuGet package, the version the
  # directx/ headers are, goes beside each test in D3D12/, where the
  # tests' exports point.
  windows-d3d12:
    name: windows-d3d12
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        # With the seam check: a Maul Window window on WARP (mrhi-0028).
        run: cmake -B build -T ClangCL -D${PREFIX}_WERROR=ON -DMAUL_RHI_SEAM=ON
      - name: Build
        run: cmake --build build --config Debug -j 4
      - name: Place the Agility SDK beside the tests
        run: |
          curl -sSfL -o agility.zip https://www.nuget.org/api/v2/package/Microsoft.Direct3D.D3D12/1.619.5
          unzip -q agility.zip -d agility
          for dir in $(find build -name 'test_*.exe' -exec dirname {} \; | sort -u); do
            mkdir -p "$dir/D3D12"
            cp agility/build/native/bin/x64/*.dll "$dir/D3D12/"
          done
      - name: Probe presentation timing
        # Whether a flip-model swapchain on WARP in the runner's desktop
        # reports frame statistics, which present timing needs.
        continue-on-error: true
        run: |
          mkdir -p probe
          cat > probe/present.c <<'EOF'
          #define COBJMACROS
          #include <windows.h>
          #include <d3d12.h>
          #include <dxgi1_6.h>
          #include <stdio.h>
          static LRESULT CALLBACK Proc(HWND window, UINT message, WPARAM w, LPARAM l)
          {
              return DefWindowProcW(window, message, w, l);
          }
          int main(void)
          {
              IDXGIFactory4* factory = NULL;
              IDXGIAdapter* warp = NULL;
              ID3D12Device* device = NULL;
              ID3D12CommandQueue* queue = NULL;
              IDXGISwapChain1* chain = NULL;
              HRESULT hr = CreateDXGIFactory2(0, &IID_IDXGIFactory4, (void**)&factory);
              hr = SUCCEEDED(hr) ? IDXGIFactory4_EnumWarpAdapter(factory, &IID_IDXGIAdapter, (void**)&warp) : hr;
              hr = SUCCEEDED(hr) ? D3D12CreateDevice((IUnknown*)warp, D3D_FEATURE_LEVEL_11_0, &IID_ID3D12Device, (void**)&device) : hr;
              D3D12_COMMAND_QUEUE_DESC queueDesc = {0};
              hr = SUCCEEDED(hr) ? ID3D12Device_CreateCommandQueue(device, &queueDesc, &IID_ID3D12CommandQueue, (void**)&queue) : hr;
              WNDCLASSW type = {0};
              type.lpfnWndProc = Proc;
              type.hInstance = GetModuleHandleW(NULL);
              type.lpszClassName = L"probe";
              RegisterClassW(&type);
              HWND window = CreateWindowExW(0, L"probe", L"probe", WS_OVERLAPPEDWINDOW | WS_VISIBLE, 0, 0, 256, 256, NULL, NULL, type.hInstance, NULL);
              DXGI_SWAP_CHAIN_DESC1 desc = {0};
              desc.Width = 256;
              desc.Height = 256;
              desc.Format = DXGI_FORMAT_B8G8R8A8_UNORM;
              desc.SampleDesc.Count = 1;
              desc.BufferUsage = DXGI_USAGE_RENDER_TARGET_OUTPUT;
              desc.BufferCount = 2;
              desc.SwapEffect = DXGI_SWAP_EFFECT_FLIP_DISCARD;
              hr = SUCCEEDED(hr) ? IDXGIFactory4_CreateSwapChainForHwnd(factory, (IUnknown*)queue, window, &desc, NULL, NULL, &chain) : hr;
              printf("setup 0x%08lx window %p\n", (unsigned long)hr, (void*)window);
              if (FAILED(hr))
              {
                  return 0;
              }
              for (int i = 0; i < 30; ++i)
              {
                  MSG message;
                  while (PeekMessageW(&message, NULL, 0, 0, PM_REMOVE))
                  {
                      TranslateMessage(&message);
                      DispatchMessageW(&message);
                  }
                  HRESULT presented = IDXGISwapChain1_Present(chain, 1, 0);
                  DXGI_FRAME_STATISTICS stats = {0};
                  HRESULT read = IDXGISwapChain1_GetFrameStatistics(chain, &stats);
                  UINT last = 0;
                  IDXGISwapChain1_GetLastPresentCount(chain, &last);
                  printf("present %2d: 0x%08lx stats 0x%08lx PresentCount %u PresentRefreshCount %u "
                         "SyncRefreshCount %u SyncQPCTime %lld last %u\n",
                         i, (unsigned long)presented, (unsigned long)read, stats.PresentCount,
                         stats.PresentRefreshCount, stats.SyncRefreshCount,
                         (long long)stats.SyncQPCTime.QuadPart, last);
                  Sleep(16);
              }
              return 0;
          }
          EOF
          cat > probe/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.25)
          project(probe C)
          add_executable(present present.c)
          target_link_libraries(present d3d12 dxgi dxguid)
          EOF
          cmake -S probe -B probe/build -T ClangCL
          cmake --build probe/build --config Release
          probe/build/Release/present.exe
      - name: Test
        env:
          MAUL_RHI_REQUIRE_D3D12: "1"
          MAUL_RHI_REQUIRE_SURFACE: "1"
          MAUL_RHI_REQUIRE_BINDLESS: "1"
          MAUL_RHI_REQUIRE_STATISTICS: "1"
          MAUL_RHI_D3D12_DEBUG: "1"
        run: ctest --test-dir build -C Debug --output-on-failure

  web-wasi:
    # The web without Emscripten (mrhi-0016): Clang's wasm32-wasi, the
    # suites under Node's WASI and the conformance suite in headless
    # Chrome with WebGPU, which it must find.
    name: web-wasi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang-20 lld-20 wasi-libc libclang-rt-20-dev-wasm32
      - name: Configure
        run: |
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=cmake/wasm32-wasi.cmake -DCMAKE_C_COMPILER=clang-20 \
            -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON
      - name: Build
        run: cmake --build build -j 4
      - name: Browser
        run: npm install --prefix /tmp/browser puppeteer
      - name: Test
        env:
          MRHI_NODE_MODULES: /tmp/browser/node_modules
          MAUL_RHI_REQUIRE_WEBGPU: "1"
        run: ctest --test-dir build --output-on-failure

  web:
    name: web-emscripten
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Configure
        run: |
          emcmake cmake -B build -DCMAKE_BUILD_TYPE=Release -D${PREFIX}_WERROR=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DMAUL_RHI_SEAM=ON
      - name: Build
        run: cmake --build build -j 4
      - name: clang-tidy
        # The web-only sources, against Emscripten's sysroot.
        run: |
          sudo apt-get install -y -q clang-tidy-20
          sysroot=$(em-config CACHE)/sysroot
          for f in $(grep -l '"web_js.h"' src/*.c); do
            clang-tidy-20 -p build --quiet --warnings-as-errors='*' --extra-arg=--sysroot=$sysroot \
              --extra-arg=--target=wasm32-unknown-emscripten "$f" || exit 1
          done
      - name: Browser
        run: npm install --prefix /tmp/browser puppeteer
      - name: Test
        # The suites run in node, the conformance suite in headless Chrome
        # with WebGPU, which it must find (mrhi-0003).
        env:
          MRHI_NODE_MODULES: /tmp/browser/node_modules
          MAUL_RHI_REQUIRE_WEBGPU: "1"
        run: ctest --test-dir build --output-on-failure
      - name: Seam
        # The seam with Maul Window (mrhi-0028): its canvas, named by the
        # window's handles, presented to; it must not be skipped.
        env:
          MRHI_NODE_MODULES: /tmp/browser/node_modules
          MAUL_RHI_REQUIRE_WEBGPU: "1"
          MAUL_RHI_REQUIRE_SURFACE: "1"
        run: ctest --test-dir build -R '^seam$' --output-on-failure
      - name: Size
        # The wasm budget (mrhi-0001): the library at -Oz without its
        # tests, every public function kept.
        run: |
          emcmake cmake -B build-size -DCMAKE_BUILD_TYPE=MinSizeRel \
            "-DCMAKE_C_FLAGS_MINSIZEREL=-Oz -DNDEBUG" -D${PREFIX}_BUILD_TESTS=OFF \
            -D${PREFIX}_BUILD_BENCH=OFF -D${PREFIX}_BUILD_SAMPLES=OFF >/dev/null
          cmake --build build-size -j 4
          python3 tools/wasm_size.py build-size/libmaul-rhi.a
